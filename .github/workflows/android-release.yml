name: Android release APK

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Run checks and native generation without signing or publishing"
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: mobile

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      versionCode: ${{ steps.version.outputs.versionCode }}
      apk: ${{ steps.version.outputs.apk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Validate package/tag version
        id: version
        run: node scripts/android-release.cjs metadata
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx --no-install expo install --check
      - name: Generate and validate native release configuration
        run: |
          npx --no-install expo prebuild --platform android --no-install
          node scripts/android-release.cjs prepare
          test -s android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          grep -q 'signingConfig null' android/app/build.gradle

  build:
    needs: checks
    if: github.event_name != 'workflow_dispatch' || !inputs.validation_only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: android-release
    env:
      ANDROID_PUBLIC_BACKEND_APPROVED: ${{ vars.ANDROID_PUBLIC_BACKEND_APPROVED }}
      EXPO_PUBLIC_API_URL: ${{ secrets.ANDROID_PRODUCTION_API_URL }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      ANDROID_RELEASE_BUILD: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Fail closed before installation or build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: node scripts/android-release.cjs preflight
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install locked native toolchain
        # Versions from RN 0.88 / Expo 58 catalogs. Keep generated Gradle wrapper.
        run: sdkmanager 'platform-tools' 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - name: Restore optional Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          umask 077
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi
      - name: Generate Android release project
        run: |
          npx --no-install expo prebuild --platform android --no-install
          node scripts/android-release.cjs prepare
      - name: Assemble genuine release APK and run Android lint
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease :app:lintRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Align, sign, validate and checksum APK
        env:
          APK_NAME: ${{ needs.checks.outputs.apk }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quant-release.jks"
          test -s "$RUNNER_TEMP/quant-release.jks"
          mkdir -p release
          tools="$ANDROID_HOME/build-tools/37.0.0"
          unsigned=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/quant-release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "release/$APK_NAME" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "release/$APK_NAME" > "$RUNNER_TEMP/apk-certificates.txt"
          "$tools/zipalign" -c -P 16 -v 4 "release/$APK_NAME" > /dev/null
          "$tools/aapt" dump badging "release/$APK_NAME" > "$RUNNER_TEMP/apk-badging.txt"
          node scripts/android-release.cjs verify "$RUNNER_TEMP/apk-badging.txt" "$RUNNER_TEMP/apk-certificates.txt"
          unzip -t "release/$APK_NAME" > /dev/null
          unzip -l "release/$APK_NAME" > "$RUNNER_TEMP/apk-entries.txt"
          grep -q 'assets/index.android.bundle' "$RUNNER_TEMP/apk-entries.txt"
          grep -q 'classes.dex' "$RUNNER_TEMP/apk-entries.txt"
          grep -q 'lib/arm64-v8a/' "$RUNNER_TEMP/apk-entries.txt"
          grep -q 'lib/x86_64/' "$RUNNER_TEMP/apk-entries.txt"
          node scripts/android-release.cjs notes release/RELEASE_NOTES.md
          cd release
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          sha256sum --check "$APK_NAME.sha256"
      - name: Upload only signed release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-${{ needs.checks.outputs.version }}
          path: |
            mobile/release/*.apk
            mobile/release/*.apk.sha256
            mobile/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/quant-release.jks" "$RUNNER_TEMP/aligned.apk" "$RUNNER_TEMP/google-services.json" android/app/google-services.json

  publish:
    needs: [checks, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-release
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Download validated release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-${{ needs.checks.outputs.version }}
          path: release
      - name: Publish immutable version release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_NAME: ${{ needs.checks.outputs.apk }}
        run: |
          cd release
          sha256sum --check "$APK_NAME.sha256"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; assets will not be overwritten. Use a new version.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --verify-tag --title "Quant's Trade Android ${RELEASE_TAG#mobile-v}" --notes-file RELEASE_NOTES.md
